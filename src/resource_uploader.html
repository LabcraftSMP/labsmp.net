  
<!DOCTYPE HTML>
<html>
    <head>
        <title>LAB Resource Uploader</title>
        <link rel="stylesheet" href="resource_uploader/styles.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
        <script src="resource_uploader/script.js" defer></script>
    </head>
    <body>
        <div>
            <h1>LAB Resource Uploader</h1>
            <div class="row">
                <img src="#", id="previewImage">
                <img src="#", id="previewImage2" style="display: none;">
            </div>
            <table>
                <tr>
                    <td><label>Resource Type</label></td>
                    <td><select onchange="changeResourceType(this.value)">
                        <option value="basic">Basic Texture</option>
                        <option value="tool">Tool Texture</option>
                        <option value="elytra">Elytra Texture</option>
                        <option value="model">Custom Model</option>
                    </select></td>
                </tr>
                <tr>
                    <td><label id="imageInputLabel" for="imageInput">Texture:</label></td>
                    <td colspan="2"><input type="file", accept="image/png", onchange="changeImage(this)", id="imageInput"></td>
                </tr>
                <tr id="image2Row" style="display: none;">
                    <td><label id="image2InputLabel" for="image2Input">Texture 2:</label></td>
                    <td colspan="2"><input disabled type="file", accept="image/png", onchange="changeImage2(this)", id="image2Input"></td>
                </tr>
                <tr id="modelRow" style="display: none;">
                    <td><label for="modelInput">JSON Model:</label></td>
                    <td colspan="2"><input disabled type="file", accept="application/json", onchange="changeModel(this)", id="modelInput"></td>
                </tr>
                <tr>
                    <td><label for="textureName">Texture Name:</label></td>
                    <td colspan="2"><input type="text", id="textureName", placeholder="my_epic_sword", onchange="changeName(this.value)"></td>
                </tr>
            </table>
            <p>Do not attempt to make textures for blocks or 3D items at this point in time. Thanks</p>
            <p>When you are done, download below and send the zip to <b>chililisoup</b></p>
            <button disabled onclick="download()" id="download" style="margin-bottom: 100px;">Download</button>
        </div>
    </body>
</html>
